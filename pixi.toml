# Software environment of this project. Edit it with `pixi add <package>`;
# Pixi records the exact versions it installed in pixi.lock (commit both).
[workspace]
name = "probabilistic-graphlets"
description = "Gene function prediction from calibrated probabilistic graphlets in a monocyte co-expression network"
authors = ["Michelle Gandidzanwa <Michelle.Gandidzanwa@mbzuai.ac.ae>"]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "osx-arm64", "osx-64"]
version = "0.1.0"

[dependencies]
python = "3.13.*"
quarto = ">=1.9"
jupyterlab = ">=4"
ipykernel = ">=7"
pandas = ">=2"
matplotlib = ">=3.9"
papermill = ">=2.6"   # Quarto needs it for report parameters (-P)
numpy = ">=2.5.5,<3"
scipy = ">=1.18.1,<2"
scikit-learn = ">=1.9.1,<2"
networkx = ">=3.7,<4"
pyyaml = ">=6.0.3,<7"
tabulate = ">=0.10.0,<0.11"
curl = ">=8.23.0,<9"
coreutils = ">=9.12,<10"
snakemake = ">=9.24.0,<10"

[tasks]
check = { cmd = "python --version && quarto --version", description = "Check that the tools work" }
test = { cmd = "python tests/test_graphlets.py", description = "Check graphlet counting against exact enumeration" }

# The analysis is a Snakemake workflow (workflow/Snakefile), one rule per step.
download = { cmd = "bash scripts/download.sh", description = "Download the raw data listed in metadata/sources.tsv and check checksums" }
dry-run = { cmd = "snakemake -s workflow/Snakefile -n", description = "Show which steps would run, without running them" }

# `reproduce` must rebuild every result from the raw data with one command.
reproduce = { cmd = "snakemake -s workflow/Snakefile --cores all", description = "Run the Snakemake workflow: download, every analysis step and the report" }

[pypi-dependencies]
orbit-count = ">=0.1.0, <0.2"
